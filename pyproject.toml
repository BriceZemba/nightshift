[project]
name = "nightshift"
version = "0.1.0"
description = "An agent fleet that triages, patches and opens evidence-backed PRs for security advisories overnight."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Google agent stack - see docs/08-TECH-REFERENCE.md before changing these pins.
    # The Interactions API (google-genai >= 2.3.0) replaced generate_content.
    # ADK 2.x is a graph engine; SequentialAgent/ParallelAgent/LoopAgent are deprecated.
    "google-genai>=2.3.0",
    "google-adk>=2.6.3",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-secret-manager>=2.20.0",
    # Advisory sources + GitHub
    "httpx>=0.27.0",
    "packaging>=24.0",
    # Config and models
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
nightshift = "nightshift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightshift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# BLE001 (blind except) is intentionally enabled: a broad `except Exception:` inside an ADK 2.x
# tool silently defeats the runtime's auto-retry, and catching BaseException traps
# NodeInterruptedError and breaks human-in-the-loop. See docs/08-TECH-REFERENCE.md.
extend-select = ["BLE"]
# N818 wants an "Error" suffix on exception names. PolicyViolation is deliberate domain
# language -- it is raised, caught and asserted on by that name throughout, and it reads
# as what it is: a boundary crossing, not a runtime fault.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Tests favour readable literal fixtures over wrapped lines.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
